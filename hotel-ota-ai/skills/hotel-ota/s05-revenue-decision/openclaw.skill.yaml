name: s05-revenue-decision
description: |
  收益调价建议：根据 runtime 的商品、房型、S15、S16、流量和收益证据生成只读调价候选。
  对应 runtime 命令：python runtime/hotel_ota_runtime.py revenue-decision --hotel-id <hotel_id>
  runtime commands: revenue-decision, expected-occupancy, baseline-price
instructions: |
  职责：处理收益调价建议场景，只根据 runtime 证据输出结论。
  允许输入：hotel_id, business_date, as_of_time, runtime context.
  输出口径：runtime result, evidence, risk flags, data_gap, blocked_reason.
  数据来源要求：runtime CLI and controlled database-query only.
  生产与执行边界：
  - 生产 Feishu 必须使用 verified role；需要时由 HOTEL_OTA_REQUIRE_VERIFIED_ROLE 强制
  - 只能调用 runtime 已暴露的受控命令；agent 不得自行执行 SQL、改文件或直接调用 OTA/PMS live API
  - demo/sample/synthetic/hardcoded 数据不得用于 production Feishu 业务结论
  - 缺少必要数据必须返回 data_gap，不得编造成 0 或继续给正式结论
  - 禁用渠道不得参与读取、分析和展示
  - 商品映射可信、商品可编辑、数据新鲜和 S15 时间证据成熟是正式候选前提
  - S5 不读取或引用配置价格上下限；候选价仅受 S5 单次变动 10% 硬上限约束
  - 生产飞书输出必须遵守 feishu-output-gate 语义
  - 不得输出 DSN、token、服务器私有路径、原始订单行、payload_hash 或内部 request payload；no private path
  - runtime 未返回 write_performed=true、affected_rows>0、config_change_applied=true 或 audit_id 时，不得声称已执行、已删除、已写入或已配置
  S5 飞书回复模板：
  - 顺序保持为总览、逐商品解析、边界
  - 每个商品单独说明当前价、候选价和主要未触发原因
  - 相同市场或边界信息可以精简，但不能只列商品清单，也不能合并不同商品的原因
  - 沿用现有飞书长度与安全规则，不设置额外字符额度
notes: |
  triggers.yaml 只是 skill 标准化配置和后续迁移依据，当前生产事实路由仍是 runtime/feishu_command_router.py。不得创建或依赖 skills/ota-diagnosis。
