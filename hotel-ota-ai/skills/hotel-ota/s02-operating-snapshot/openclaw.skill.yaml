name: s02-operating-snapshot
description: |
  经营快照: 处理 经营快照 场景，只根据 runtime 证据输出结论。
  生产 Feishu 实时出租率命令: python runtime/hotel_ota_runtime.py feishu-route --message "实时出租率" --production-feishu --chat-id <trusted_chat_id> --open-id <trusted_sender_id>
  本地诊断实时出租率命令: python runtime/hotel_ota_runtime.py expected-occupancy --hotel-id <hotel_id> --date <target_business_date> --as-of-time <as_of_time>
  runtime commands: feishu-route, expected-occupancy, snapshot, database-query
instructions: |
  职责: 处理 经营快照 场景，只根据 runtime 证据输出结论。
  允许输入: hotel_id, target_business_date, as_of_time, runtime context.
  输出口径: runtime result, evidence, risk flags, data_gap, blocked_reason.
  数据来源要求: runtime CLI and controlled database-query only.
  guardrail / 护栏:
  - 生产 Feishu 必须使用 verified role；需要时由 HOTEL_OTA_REQUIRE_VERIFIED_ROLE 强制
  - 生产 Feishu 业务必须带可信会话和发送人身份；缺失时返回 missing_required_feishu_auth_context / missing_trusted_business_chat_id，不得误报群未绑定
  - target_business_date 是 runtime 目标业务日期，不是 jd01.business_date 字段；jd01 当日预订和取消按 DATE(arrival_time)=target_business_date 统计
  - 实时出租率必须使用 jd01 已入住且 departure_time > as_of_time + jd01 当日有效预订扣取消 + jd04 续住，分母使用 kf11 总房减维修房
  - snapshot / jy01_hotel_statistics_daily.occupancy_rate 只能作为历史经营快照，不能回答当前实时出租率
  - 只能调用 runtime 已暴露的受控命令；agent 不得自行执行 SQL、改文件或直接调用 OTA/PMS live API
  - demo/sample/synthetic/hardcoded 数据不得用于 production Feishu 业务结论
  - 缺少必要数据必须返回 data_gap，不得编造成 0 或继续给正式结论
  - 禁用渠道不得参与读取、分析和展示
  - 生产飞书输出必须遵守 feishu-output-gate 语义
  - 不得输出 DSN、token、服务器私有路径、原始订单行、payload_hash 或内部 request payload；no private path
  - runtime 未返回 write_performed=true、affected_rows>0、config_change_applied=true 或 audit_id 时，不得声称已执行、已删除、已写入或已配置
notes: |
  triggers.yaml 只是 skill 标准化配置和后续迁移依据，当前生产事实路由仍是 runtime/feishu_command_router.py。 不得创建或依赖 skills/ota-diagnosis。
