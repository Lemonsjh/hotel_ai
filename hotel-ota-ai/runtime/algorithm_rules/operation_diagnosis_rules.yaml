  "algorithm": {
    "objective": "Diagnose OTA operation health and produce prioritized A/B action tasks without recomputing upstream business metrics.",
    "ordered_steps": [
      {
        "step_id": "s14_00",
        "action": "Apply source-role ownership before projection: current actual from domain capabilities, baseline from S15, deviation/diagnosis from S16. Ignore non-owner duplicates for business output and never recompute S16 gaps in S14."
      },
      {
        "step_id": "s14_01",
        "action": "Score content, price, traffic, conversion, HOS/PSI, reputation, and task closure dimensions."
      },
      {
        "step_id": "s14_02",
        "action": "Mark A tasks for blocking or high-impact issues and B tasks for ongoing optimization."
      },
      {
        "step_id": "s14_03",
        "action": "Route price actions to S5, reputation actions to S12/S13, and messages to S3."
      },
      {
        "step_id": "s14_04",
        "action": "Report missing data and confidence instead of writing long generic diagnosis."
      }
    ],
    "thresholds": {
      "a_task_score_at_or_above": 80,
      "b_task_score_at_or_above": 50,
      "field_coverage_warn_below": 0.8
    },
    "degradation": [
      "When hard-required fields are missing, return missing_fields and confidence=low.",
      "When input is demo/sample/stale, return preview_only or dry_run and block formal approval/live.",
      "When source capability is read-only/manual, produce recommendation or task only.",
      "When S15 is missing/conflict/stale/blocked, block S16-derived deviation conclusions instead of recomputing them in S14.",
      "When a domain actual is missing, return data_gap instead of using S15/S16 copied values as fallback."
    ],
    "output_contract": [
      "diagnosis_scorecard",
      "a_tasks",
      "b_tasks",
      "confidence"
    ]
  },
  "forbidden_actions": [
    "treat_demo_data_as_real_today_data",
    "create_formal_approval_from_demo_or_stale_data",
    "bypass_data_gate_or_approval_guard",
