  },
  "algorithm": {
    "objective": "Analyze hotel-level and canonical-room-type order structure without creating customer profiles or direct actions.",
    "ordered_steps": [
      {"step_id": "s17_01", "action": "Resolve exact server-side hotel_id, local business window and as-of time."},
      {"step_id": "s17_02", "action": "Select the latest source record per approved dedupe scope before cohort filtering and aggregation."},
      {"step_id": "s17_03", "action": "Keep booking, realized stay, physical occupancy, extension and provider populations separate."},
      {"step_id": "s17_04", "action": "Compute cancellation, channel, source, room, lead-time and stay-duration structures deterministically."},
      {"step_id": "s17_05", "action": "Compute contact-repeat proxies only with a hotel-scoped HMAC inside the trusted aggregation boundary."},
      {"step_id": "s17_06", "action": "Apply primary, complementary and unknown-denominator suppression before sorting, paging, caching or AI context."}
    ],
    "privacy_policy": {
      "minimum_cohort_size_range": [3, 100],
      "max_output_cells_range": [10, 500],
      "raw_row_output_allowed": false,
      "raw_contact_output_allowed": false,
      "cross_hotel_identity_allowed": false
    },
    "thresholds": {
      "minimum_cohort_size_range": [3, 100],
      "max_output_cells_range": [10, 500]
    },
    "degradation": [
      "Missing provider populations remain unavailable without blocking valid core populations.",
      "Missing hotel-scoped HMAC disables contact proxy metrics and exact lookup.",
      "Missing canonical room_type_id increments unmapped_count and blocks room-type conclusions."
    ],
    "output_contract": [
      "populations", "current_cancelled_share", "booking_channel_order_distribution",
      "booking_channel_room_distribution", "realized_room_nights", "realized_room_fee", "realized_adr",
      "lead_time_buckets", "stay_duration_buckets", "contact_seen_before_share_proxy",
      "repeat_booking_contact_share_proxy", "repeat_booking_order_share_proxy",
      "repeat_stayed_contact_share_proxy", "data_gaps", "privacy_policy"
    ]
  },
  "forbidden_actions": [
    "treat_demo_data_as_real_today_data", "customer_profile", "customer_scoring", "target_guest_task", "send_offer", "contact_customer",
    "join_populations_into_total_customer_count", "emit_raw_order_rows", "emit_contact_or_contact_hash",
    "use_hotel_name_as_tenant_scope", "infer_canonical_room_type_from_name", "claim_proxy_as_verified_repeat_rate"
